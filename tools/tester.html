<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — triage de tickets (Laya fine-tuné)</title>
<style>
  :root { --navy:#16304f; --blue:#2f6fb0; --green:#1e7a3c; --line:#d5dee8; --bg:#f4f7fb; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         color:#20262e; background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:18px 22px;
           display:flex; align-items:center; justify-content:space-between; gap:16px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:13px; color:#c9d8e8; }
  a.onepager { flex:0 0 auto; background:#2f6fb0; color:#fff; text-decoration:none;
               font-weight:700; font-size:13px; letter-spacing:.6px; padding:9px 16px;
               border-radius:8px; border:1px solid rgba(255,255,255,.35); white-space:nowrap; }
  a.onepager:hover { background:#255e98; }
  main { width:80%; margin:20px auto; padding:0 0 40px;
         display:grid; grid-template-columns:1fr 3fr; gap:16px; align-items:start; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px;
          margin-bottom:16px; box-shadow:0 1px 2px rgba(20,40,70,.05); }
  label { font-weight:600; font-size:13px; color:var(--navy); }
  textarea { width:100%; margin-top:6px; padding:10px; border:1px solid var(--line);
             border-radius:8px; font:14px/1.45 inherit; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .ticket-row { display:flex; gap:10px; align-items:center; }
  .ticket-row > textarea { flex:1 1 auto; width:auto; margin-top:0; }
  #guidePanel { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  #ticketCard, #out { height:80vh; overflow:auto; }
  button { font:14px inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
           background:#fff; cursor:pointer; }
  button:hover { border-color:var(--blue); color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;
                   padding:10px 18px; }
  button.primary:disabled { opacity:.6; cursor:progress; }
  .muted { color:#6b7684; font-size:13px; }
  .results { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; align-items:start; }
  .colhead { font-weight:700; font-size:12.5px; color:#5b6470; padding:2px 4px; }
  .colhead.ft { color:#1f4e79; }
  .qhead { grid-column:1 / -1; font-weight:700; font-size:13px; color:var(--navy);
           margin-top:6px; border-bottom:1px solid var(--line); padding-bottom:3px; }
  .badge { font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 8px; margin-left:6px; }
  .badge.diff { background:#fdeceb; color:#b3261e; }
  .badge.same { background:#eef3f8; color:#7a8a99; }
  .rcard.ft { border-left:3px solid #2f6fb0; }
  .rcard.ft.diff { border-left-color:#e0902a; }
  .rcard { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px;
           box-shadow:0 1px 2px rgba(20,40,70,.05); }
  .rcard h3 { margin:0 0 6px; font-size:13px; color:var(--navy); }
  .val { font-size:18px; font-weight:700; }
  /* modèles : plus de sélection, comparaison côte à côte (voir .results) */
  .bar { height:9px; background:#eef3f8; border-radius:5px; overflow:hidden; margin:5px 0; }
  .bar > span { display:block; height:100%; background:var(--blue); }
  .bar.green > span { background:var(--green); }
  .plist { font-size:12.5px; color:#5b6470; }
  #guideBody { max-height:none; overflow:visible; }
  @media (max-width: 820px) {
    main { grid-template-columns:1fr; }
    #ticketCard, #out { height:auto; overflow:visible; }
    #guideBody { max-height:none; }
  }
  table.guide { width:100%; border-collapse:collapse; font-size:12.5px; margin:6px 0 14px; }
  table.guide th, table.guide td { border:1px solid var(--line); padding:6px 8px;
                                   text-align:left; vertical-align:top; }
  table.guide th { background:#eef3f8; color:var(--navy); }
  .gtitle { font-weight:700; color:var(--navy); margin-top:8px; }
  .gq { color:#6b7684; font-size:12.5px; margin-bottom:2px; }
  .qdef { font-size:12.5px; color:#3a4a5c; background:#f6f9fc; border-left:3px solid var(--blue);
          padding:6px 9px; border-radius:4px; margin:6px 0 0; }
  .qdef b { color:var(--navy); }
  .tip { position:relative; border-bottom:1px dotted var(--blue); cursor:help; }
  .tipbox { display:none; position:absolute; left:0; bottom:145%; z-index:20; width:300px;
            background:var(--navy); color:#fff; font-size:12px; font-weight:400; line-height:1.45;
            padding:8px 10px; border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.25); text-align:left; }
  .tipbox b { color:#fff; }
  .tip:hover .tipbox { display:block; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="h1">Laya tester</h1>
    <p id="status">…</p>
  </div>
  <a class="onepager" href="/onepager.pdf" target="_blank" rel="noopener"
     title="Ouvrir le one-pager PDF (synthèse du projet)">ONE&nbsp;PAGER</a>
</header>
<main>
  <div class="col">
    <section class="card" id="ticketCard">
      <label for="state" id="ticketLabel">Ticket</label>
      <div class="row" id="langs"></div>
      <div class="ticket-row">
        <textarea id="state" rows="5"></textarea>
        <button id="go" class="primary">…</button>
      </div>
      <div class="row">
        <button id="guideBtn">…</button>
        <span id="lat" class="muted"></span>
      </div>
      <div id="guidePanel" style="display:none">
        <div id="guideBody" class="muted"></div>
      </div>
    </section>
  </div>
  <div class="col">
    <section id="out">
      <div class="card muted" id="placeholder">…</div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const EXAMPLES = {
  en: "I was charged twice for my March subscription. Please refund the duplicate charge or I will cancel my account.",
  fr: "Je n'arrive plus à me connecter : la connexion à deux facteurs échoue sur mon nouveau téléphone.",
  de: "Die App stürzt bei jedem Foto-Upload ab. Das blockiert unser ganzes Team und muss heute behoben werden.",
  es: "No puedo restablecer mi contraseña y el correo no llega. Sin prisa, cuando puedan.",
  hi: "मार्च की सदस्यता के लिए मुझसे दो बार शुल्क लिया गया। कृपया मुझे राशि वापस करें।"
};
let T = {};                    // UI strings of the current language
let GUIDE = {};                // category guide of the current language
let LANG = "en";
let LAST = null;               // last /predict response, re-rendered on language change
let MODELS = {};               // id -> {label, name}
let guideOpen = false;

const pct = (p) => (p == null ? "" : Math.round(p * 100) + "%");
const bar = (p, green) =>
  `<div class="bar${green ? ' green' : ''}"><span style="width:${Math.round(p * 100)}%"></span></div>`;

// --- language selector: switches the whole UI *and* fills a matching ticket ----
$("#langs").innerHTML = Object.keys(EXAMPLES)
  .map(l => `<button data-lang="${l}">${l.toUpperCase()}</button>`).join("");
$("#langs").addEventListener("click", e => {
  const l = e.target.dataset.lang;
  if (l) setLang(l, true);
});

async function setLang(lang, fillExample) {
  LANG = lang;
  try {
    const d = await (await fetch(`/i18n?lang=${lang}`)).json();
    T = d.ui || {}; GUIDE = d.guide || {};
  } catch (e) { /* keep the previous strings */ }
  document.documentElement.lang = lang;
  $("#h1").textContent = T.header;
  $("#ticketLabel").textContent = T.ticket_label;
  $("#go").textContent = T.analyze;
  guideBtn.textContent = guideOpen ? T.guide_open : T.guide_closed;
  $("#status").textContent = MODELS.ft ? `${T.ft_col} · ${MODELS.ft.name}` : T.ready;
  if (fillExample) $("#state").value = EXAMPLES[lang];
  renderGuide();
  if (LAST) render(LAST); else $("#out").innerHTML = `<div class="card muted">${T.placeholder}</div>`;
}

// guide access via a button inside the ticket card
const guidePanel = $("#guidePanel"), guideBtn = $("#guideBtn");
guideBtn.addEventListener("click", () => {
  guideOpen = !guideOpen;
  guidePanel.style.display = guideOpen ? "block" : "none";
  guideBtn.textContent = guideOpen ? T.guide_open : T.guide_closed;
});

function cardFor(qid, ans) {
  const g = GUIDE[qid];
  const catOf = (k) => (g ? g.categories.find(c => c.label === k) || null : null);
  let val = "", extra = "", cat = null;
  if (ans.type === "choice") {
    cat = catOf(String(ans.label));
    val = tipHTML(ans.label, cat);
    if (ans.probabilities) {
      extra = Object.entries(ans.probabilities).sort((x, y) => y[1] - x[1])
        .map(([k, v]) =>
          `<div class="plist">${tipHTML(k, catOf(k))} — ${pct(v)}${bar(v, k === ans.label)}</div>`)
        .join("");
    }
  } else if (ans.type === "score") {
    const i = Math.round(ans.score);
    const lvl = ans.levels ? ans.levels[i] : "";
    cat = catOf(String(i));
    val = `${ans.score.toFixed(1)} <span class="muted">— ${tipHTML(lvl, cat)}</span>`;
  } else {
    const yes = ans.yes_prob >= 0.5;
    cat = catOf(yes ? "yes" : "no");
    val = `${tipHTML(yes ? T.yes : T.no, cat)} <span class="muted">(${pct(ans.yes_prob)} ${T.of_yes})</span>`;
    extra = bar(ans.yes_prob, true);
  }
  const def = cat
    ? `<div class="qdef"><b>${cat.domain}</b> — ${cat.definition}<br><b>${T.guide_col_action} :</b> ${cat.action}</div>`
    : "";
  return `<div class="val">${val}</div>${extra}
    <div class="muted" style="font-size:12px">${T.confidence} : ${pct(ans.confidence)}</div>${def}`;
}

// does the fine-tuned answer differ from the base one?
function isDiff(a, b) {
  if (a.type === "choice") return String(a.label) !== String(b.label);
  if (a.type === "score") return Math.abs(a.score - b.score) >= 0.5;
  return (a.yes_prob >= 0.5) !== (b.yes_prob >= 0.5);
}

// two columns (one per model), four stacked cards each (1x4 vs 1x4)
function render(resp) {
  LAST = resp;
  const { base, ft } = resp;
  const n = (m) => (MODELS[m] && MODELS[m].name ? ` · ${MODELS[m].name}` : "");
  let html = `<div class="colhead">${T.base_col}${n("base")}</div>
              <div class="colhead ft">${T.ft_col}${n("ft")}</div>`;
  for (const qid of Object.keys(ft)) {
    const diff = isDiff(base[qid], ft[qid]);
    const badge = diff ? `<span class="badge diff">${T.differs}</span>`
                       : `<span class="badge same">${T.same}</span>`;
    const title = (GUIDE[qid] && GUIDE[qid].title) || qid;
    html += `<div class="qhead">${title} <span class="muted">· ${qid}</span>${badge}</div>`;
    html += `<div class="rcard">${cardFor(qid, base[qid])}</div>`;
    html += `<div class="rcard ft${diff ? " diff" : ""}">${cardFor(qid, ft[qid])}</div>`;
  }
  $("#out").innerHTML = `<div class="results">${html}</div>`;
}

// the guide excerpt for one category, shown as a hover tooltip
function tipHTML(text, cat) {
  if (!cat) return text;
  return `<span class="tip">${text}<span class="tipbox"><b>${cat.label}</b> — ${cat.definition}
    <br><span style="opacity:.75">${T.guide_col_domain} : ${cat.domain}</span><br><b>${T.guide_col_action} :</b> ${cat.action}</span></span>`;
}

function renderGuide() {
  let html = "";
  for (const [qid, g] of Object.entries(GUIDE)) {
    html += `<div class="gtitle">${g.title} <span class="muted">· ${qid}</span></div>
      <div class="gq">${g.question}</div>
      <table class="guide"><thead><tr>
        <th style="width:95px">${T.guide_col_category}</th><th>${T.guide_col_definition}</th>
        <th>${T.guide_col_domain}</th><th>${T.guide_col_action}</th>
      </tr></thead><tbody>`;
    for (const c of g.categories) {
      const label = c.label === "yes" ? T.yes : c.label === "no" ? T.no : c.label;
      html += `<tr><td><b>${label}</b></td><td>${c.definition}</td>
        <td>${c.domain}</td><td>${c.action}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  $("#guideBody").innerHTML = html;
}

async function go() {
  const state = $("#state").value.trim();
  if (!state) return;
  $("#go").disabled = true; $("#lat").textContent = ""; $("#out").innerHTML = "";
  try {
    const r = await fetch("/predict", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || T.error);
    $("#lat").textContent =
      `${T.base_col} ${d.latency_ms.base} ms · ${T.ft_col} ${d.latency_ms.ft} ms`;
    render(d);
  } catch (e) {
    $("#out").innerHTML = `<div class="card muted">${T.error} : ${e.message}</div>`;
  } finally { $("#go").disabled = false; }
}
$("#go").addEventListener("click", go);
$("#state").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") go(); });

// load the served models first, then the default interface language
fetch("/models").then(r => r.json()).then(d => {
  (d.models || []).forEach(x => { MODELS[x.id] = x; });
}).catch(() => {}).finally(() => setLang("en", true));
</script>
</body>
</html>
