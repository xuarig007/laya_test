[project]
name = "layabench"
version = "0.1.0"
description = "Multilingual support-ticket triage benchmark for the Laya decision engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
laya = ["laya>=0.4"]

[project.scripts]
layabench = "layabench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["layabench"]
